name: iOS unsigned ipa

# 云端 macOS 只负责编译，签名留给你在 Windows 上用 Sideloadly 做。
# 产物：Actions 页面里的 Ledger-unsigned-ipa
# 诊断：每一步都 continue-on-error，最后把结果推到 ci-report 分支
#       （github.com 的 Actions 日志需要登录才能看，git 分支不受限制）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - id: env
        continue-on-error: true
        name: Collect environment
        run: |
          {
            echo "=== date ==="; date -u +%FT%TZ
            echo "=== sha ==="; git rev-parse HEAD
            echo "=== installed xcodes ==="; ls -d /Applications/Xcode*.app 2>/dev/null
            echo "=== default xcodebuild ==="; xcodebuild -version 2>&1
            echo "=== default swift ==="; swift --version 2>&1 | head -n 2
          } > /tmp/env.txt 2>&1
          cat /tmp/env.txt

      - id: pick
        continue-on-error: true
        name: Select newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          echo "picked=$newest" >> /tmp/env.txt
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          echo "=== after switch: xcodebuild ===" >> /tmp/env.txt
          xcodebuild -version >> /tmp/env.txt 2>&1
          echo "=== after switch: swift ===" >> /tmp/env.txt
          swift --version >> /tmp/env.txt 2>&1
          tail -n 8 /tmp/env.txt

      - id: jsdeps
        continue-on-error: true
        name: Install JS dependencies
        run: npm ci 2>&1 | tail -n 40

      - id: prebuild
        continue-on-error: true
        name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install 2>&1 | tail -n 60

      - id: pods
        continue-on-error: true
        name: Install CocoaPods
        run: cd ios && pod install 2>&1 | tail -n 40

      - id: build
        continue-on-error: true
        name: Build without code signing
        run: |
          set +e
          {
            echo "=== schemes ==="
            xcodebuild -list -workspace ios/Ledger.xcworkspace
            echo "=== build ==="
            xcodebuild \
              -workspace ios/Ledger.xcworkspace \
              -scheme Ledger \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          } > build.log 2>&1
          echo "XCODEBUILD_EXIT=$?"
          tail -n 40 build.log

      - id: package
        continue-on-error: true
        name: Package into ipa
        run: |
          mkdir -p Payload
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          echo "app=$APP"
          cp -R "$APP" Payload/
          zip -qry Ledger-unsigned.ipa Payload
          ls -lh Ledger-unsigned.ipa

      - id: report
        name: Publish report to ci-report branch
        if: always()
        run: |
          mkdir -p ci
          {
            echo "########## 结果 ##########"
            echo "env      = ${{ steps.env.outcome }}"
            echo "pick     = ${{ steps.pick.outcome }}"
            echo "jsdeps   = ${{ steps.jsdeps.outcome }}"
            echo "prebuild = ${{ steps.prebuild.outcome }}"
            echo "pods     = ${{ steps.pods.outcome }}"
            echo "build    = ${{ steps.build.outcome }}"
            echo "package  = ${{ steps.package.outcome }}"
            echo
            echo "########## 环境 ##########"
            cat /tmp/env.txt 2>/dev/null || echo "(no env)"
            echo
            echo "########## 构建错误 ##########"
            grep -n -i -E '(error:| error |failed|Could not resolve)' build.log 2>/dev/null | head -n 60 || echo "(no build.log)"
            echo
            echo "########## 构建日志尾部 ##########"
            tail -n 120 build.log 2>/dev/null || echo "(no build.log)"
          } > ci/report.txt
          wc -l ci/report.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -b ci-report
          git add -f ci/report.txt
          git commit -m "ci: report for ${{ github.sha }}" || true
          git push -f origin ci-report

      - name: Fail job if build failed
        if: steps.build.outcome != 'success' || steps.package.outcome != 'success'
        run: exit 1

      - uses: actions/upload-artifact@v4
        if: steps.package.outcome == 'success'
        with:
          name: Ledger-unsigned-ipa
          path: Ledger-unsigned.ipa
          retention-days: 7
