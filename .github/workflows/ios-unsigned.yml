name: iOS unsigned ipa

# 云端 macOS 只负责编译，签名留给你在 Windows 上用 Sideloadly 做。
# 产物：Actions 页面里的 Ledger-unsigned-ipa
# 失败时：把构建日志推到 ci-log 分支，方便本地排查

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Select newest Xcode
        run: |
          echo "=== installed ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$newest" ]; then
            echo "=== selecting $newest ==="
            sudo xcode-select -s "$newest"
          fi
          xcodebuild -version
          echo "=== swift ==="
          swift --version 2>&1 | head -n 2

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build without code signing
        id: build
        continue-on-error: true
        run: |
          set +e
          {
            echo "=== ios/ ==="
            ls -1 ios
            echo "=== schemes ==="
            xcodebuild -list -workspace ios/Ledger.xcworkspace
            echo "=== build ==="
            xcodebuild \
              -workspace ios/Ledger.xcworkspace \
              -scheme Ledger \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          } > build.log 2>&1
          code=$?
          echo "XCODEBUILD_EXIT=$code"
          tail -n 250 build.log
          exit $code

      - name: Publish build log to ci-log branch
        if: steps.build.outcome == 'failure'
        run: |
          mkdir -p ci
          {
            echo "### total lines"
            wc -l build.log
            echo "### around ExpoModulesJSI"
            awk '/Build ExpoModulesJSI xcframework/{flag=1} flag' build.log | head -n 400
            echo "### error-ish lines"
            grep -n -i -E '(error:| error |failed|Command PhaseScript)' build.log | head -n 80
            echo "### xcodebuild version"
            xcodebuild -version
            echo "### SPM context"
            grep -n -B 3 -A 40 "Could not resolve package dependencies" build.log
            echo "### tail"
            tail -n 120 build.log
          } > ci/last-build.log
          wc -c ci/last-build.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -b ci-log
          git add -f ci/last-build.log
          git commit -m "ci: build log for ${{ github.sha }}" || true
          git push -f origin ci-log

      - name: Fail the job if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Package into ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Ledger.app Payload/
          zip -qry Ledger-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Ledger-unsigned-ipa
          path: Ledger-unsigned.ipa
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
          retention-days: 7
