name: iOS unsigned ipa

# 云端 macOS 只负责编译，签名在 Windows 上用 Sideloadly 做。
# 产物：Actions 里的 Ledger-unsigned-ipa，以及 ci-ipa 分支里的同名文件
# 诊断：每一步都写日志到 /tmp，最后推到 ci-report 分支（Actions 日志页需要登录）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - id: env
        continue-on-error: true
        name: Collect environment
        run: |
          {
            echo "date=$(date -u +%FT%TZ)"
            echo "sha=$(git rev-parse HEAD)"
            echo "--- xcodes ---"
            ls -d /Applications/Xcode*.app 2>/dev/null
            echo "--- default ---"
            xcodebuild -version 2>&1
            swift --version 2>&1 | head -n 2
            node -v
            npm -v
          } > /tmp/env.txt 2>&1
          cat /tmp/env.txt

      - id: pick
        continue-on-error: true
        name: Select newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          { echo "--- after switch ($newest) ---"; xcodebuild -version; swift --version 2>&1 | head -n 2; } >> /tmp/env.txt
          tail -n 6 /tmp/env.txt

      - id: jsdeps
        continue-on-error: true
        name: Install JS dependencies
        run: |
          # lock 里的 resolved 指向国内镜像，runner 在海外，临时切到官方源（integrity 不变）
          sed -i.bak 's|https://registry.npmmirror.com|https://registry.npmjs.org|g' package-lock.json
          npm ci --no-audit --no-fund > /tmp/npm.log 2>&1
          code=$?
          echo "NPM_EXIT=$code"
          tail -n 15 /tmp/npm.log
          exit $code

      - id: prebuild
        continue-on-error: true
        name: Generate native iOS project
        run: |
          npx expo prebuild --platform ios --clean --no-install > /tmp/prebuild.log 2>&1
          code=$?
          echo "PREBUILD_EXIT=$code"
          ls -d ios 2>&1
          tail -n 40 /tmp/prebuild.log
          exit $code

      - id: pods
        continue-on-error: true
        name: Install CocoaPods
        run: |
          set +e
          if [ ! -d ios ]; then echo "NO_IOS_DIR" > /tmp/pods.log; exit 1; fi
          cd ios
          {
            echo "--- pod version ---"; pod --version
            echo "--- pod install ---"; pod install
          } > /tmp/pods.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            {
              echo "--- retry: pod install --repo-update ---"
              pod install --repo-update
            } >> /tmp/pods.log 2>&1
            code=$?
          fi
          echo "POD_EXIT=$code"
          ls -1 *.xcworkspace 2>&1
          tail -n 30 /tmp/pods.log
          exit $code
      - id: build
        continue-on-error: true
        name: Build without code signing
        run: |
          set +e
          WORKSPACE=$(ls -d ios/*.xcworkspace 2>/dev/null | head -n 1)
          if [ -z "$WORKSPACE" ]; then echo "NO_WORKSPACE" > build.log; exit 1; fi
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          {
            echo "=== schemes ==="
            xcodebuild -list -workspace "$WORKSPACE"
            echo "=== build ==="
            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          } > build.log 2>&1
          code=$?
          echo "XCODEBUILD_EXIT=$code"
          tail -n 30 build.log
          exit $code

      - id: package
        continue-on-error: true
        name: Package into ipa
        run: |
          set +e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' 2>/dev/null | head -n 1)
          echo "app=$APP"
          if [ -z "$APP" ]; then echo "NO_APP_BUNDLE"; exit 1; fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Ledger-unsigned.ipa Payload
          ls -lh Ledger-unsigned.ipa

      - id: publishipa
        continue-on-error: true
        name: Publish ipa to ci-ipa branch
        if: steps.package.outcome == 'success'
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -b ci-ipa
          git add -f Ledger-unsigned.ipa
          git commit -m "ci: ipa for ${{ github.sha }}"
          git push -f origin ci-ipa

      - id: report
        name: Publish report to ci-report branch
        if: always()
        run: |
          mkdir -p ci
          {
            echo "########## 结果 ##########"
            echo "env       = ${{ steps.env.outcome }}"
            echo "pick      = ${{ steps.pick.outcome }}"
            echo "jsdeps    = ${{ steps.jsdeps.outcome }}"
            echo "prebuild  = ${{ steps.prebuild.outcome }}"
            echo "pods      = ${{ steps.pods.outcome }}"
            echo "build     = ${{ steps.build.outcome }}"
            echo "package   = ${{ steps.package.outcome }}"
            echo "publishipa= ${{ steps.publishipa.outcome }}"
            echo
            echo "########## 环境 ##########"
            cat /tmp/env.txt 2>/dev/null || echo "(none)"
            echo
            for f in npm prebuild pods; do
              echo "########## $f 日志 ##########"
              grep -i -E '(error|failed|unable|could not|cannot|not found)' /tmp/$f.log 2>/dev/null | head -n 30 || true
              echo "--- tail ---"
              tail -n 50 /tmp/$f.log 2>/dev/null || echo "(no $f.log)"
              echo
            done
            echo "########## 构建错误 ##########"
            grep -n -i -E '(error:| error |failed|Could not)' build.log 2>/dev/null | head -n 50 || echo "(no build.log)"
            echo
            echo "########## 构建日志尾部 ##########"
            tail -n 100 build.log 2>/dev/null || echo "(no build.log)"
            echo
            echo "########## 产物 ##########"
            ls -lh Ledger-unsigned.ipa 2>/dev/null || echo "(no ipa)"
          } > ci/report.txt
          wc -l ci/report.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -b ci-report
          git add -f ci/report.txt
          git commit -m "ci: report for ${{ github.sha }}" || true
          git push -f origin ci-report

      - name: Fail job if ipa missing
        if: steps.package.outcome != 'success'
        run: exit 1

      - uses: actions/upload-artifact@v4
        if: steps.package.outcome == 'success'
        with:
          name: Ledger-unsigned-ipa
          path: Ledger-unsigned.ipa
          retention-days: 7
