name: iOS unsigned ipa

# 云端 macOS 只负责编译，签名留给你在 Windows 上用 Sideloadly 做。
# 产物：Actions 页面里的 Ledger-unsigned.ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build without code signing
        run: |
          xcodebuild \
            -workspace ios/Ledger.xcworkspace \
            -scheme Ledger \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Ledger.app Payload/
          zip -qry Ledger-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Ledger-unsigned-ipa
          path: Ledger-unsigned.ipa
          retention-days: 7
